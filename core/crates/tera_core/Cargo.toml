[package]
name = "radroots_mobile_core"
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Radroots Authors"]
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Application core runtime for Radroots apps"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false
include = ["src/**", "tests/**", "build.rs", "Cargo.toml"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = []
mobile-social = [
    "radroots_sdk/local-signing",
    "radroots_sdk/nostr",
    "radroots_sdk/sync",
]

[dependencies]
radroots_sdk = { workspace = true, features = ["memory"] }
radroots_event = { workspace = true, default-features = false, features = ["std"] }
radroots_event_codec = { workspace = true, default-features = false, features = ["json", "std"] }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
nostr = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt"] }
