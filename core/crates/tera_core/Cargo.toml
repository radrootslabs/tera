[package]
name = "radroots_mobile_core"
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Radroots Authors"]
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Application core runtime for Radroots apps"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false
include = ["src/**", "tests/**", "build.rs", "Cargo.toml"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = []
mobile-social = [
    "radroots_sdk/blossom",
    "radroots_sdk/nostr",
    "radroots_sdk/sync",
    "dep:tokio",
]

[dependencies]
radroots_blossom = { workspace = true, default-features = false, features = [
    "serde",
    "std",
] }
radroots_sdk = { workspace = true, features = ["sqlite"] }
radroots_event = { workspace = true, default-features = false, features = ["std"] }
radroots_event_codec = { workspace = true, default-features = false, features = ["json", "std"] }
radroots_identity = { workspace = true, default-features = false, features = ["std"] }
radroots_protocol = { workspace = true, default-features = false, features = ["std"] }
radroots_signing = { workspace = true, default-features = false, features = ["std"] }
radroots_storage = { workspace = true, default-features = false }
radroots_sync = { workspace = true, default-features = false }
radroots_transport = { workspace = true, default-features = false, features = ["std"] }
radroots_transport_nostr = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
nostr = { workspace = true, features = ["std"] }
radroots_nostr = { workspace = true, features = ["blossom", "signing"] }
radroots_sdk = { workspace = true, features = ["memory", "sqlite"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
