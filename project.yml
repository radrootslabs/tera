name: Tera

options:
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

packages:
  TeraApp:
    path: .
  RadrootsKit:
    url: https://github.com/radrootslabs/apple_kit.git
    revision: 68135576af9ac34126195178dabe82f02ff69497

targets:
  Tera:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tera/App/App.swift
      - path: Tera/Resources/Assets.xcassets
      - path: Tera/Resources/PrivacyInfo.xcprivacy
      - path: Tera/Resources/en.lproj/Localizable.strings
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Tera/Info.plist
    configFiles:
      Debug: Tera/Config/Debug.xcconfig
      Release: Tera/Config/Release.xcconfig
    dependencies:
      - package: TeraApp
    preBuildScripts:
      - name: Verify installed FFI artifacts
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/TeraFFI/scripts/verify-installed-artifacts.sh"
  TeraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
