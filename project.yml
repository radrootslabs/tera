name: Radroots

options:
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

packages:
  RadrootsApp:
    path: .
  RadrootsKit:
    url: https://github.com/radrootslabs/apple_kit.git
    revision: 35aedb6b54ff645b663fecff26082b3e91fcb232

targets:
  Radroots:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Radroots/App/App.swift
      - path: Radroots/Resources/Assets.xcassets
      - path: Radroots/Resources/PrivacyInfo.xcprivacy
      - path: Radroots/Resources/en.lproj/Localizable.strings
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Radroots/Info.plist
    configFiles:
      Debug: Radroots/Config/Debug.xcconfig
      Release: Radroots/Config/Release.xcconfig
    dependencies:
      - package: RadrootsApp
    preBuildScripts:
      - name: Verify installed FFI artifacts
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/RadrootsFFI/scripts/verify-installed-artifacts.sh"
  RadrootsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RadrootsTests/RadrootsRuntimeClientTests.swift
      - path: RadrootsTests/RadrootsRootShellTests.swift
      - path: RadrootsTests/RadrootsStateMigrationTests.swift
      - path: RadrootsTests/RadrootsTodayStoreTests.swift
      - path: RadrootsTests/RadrootsMediaStoreTests.swift
      - path: RadrootsTests/RadrootsAddStoreTests.swift
      - path: RadrootsTests/RadrootsSupportingStoreTests.swift
      - path: RadrootsTests/RadrootsLifecycleTests.swift
      - path: RadrootsTests/RadrootsRemoteQualificationTests.swift
      - path: RadrootsTests/RadrootsUserMessagesTests.swift
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.radroots.field-ios.tests
    dependencies:
      - target: Radroots
      - package: RadrootsApp
      - package: RadrootsKit
  RadrootsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RadrootsUITests/RadrootsRootShellUITests.swift
      - path: RadrootsUITests/RadrootsRemoteQualificationUITests.swift
      - path: test-fixtures/local-social-personas.v1.json
        buildPhase: resources
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: RadrootsUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.radroots.field-ios.uitests
    dependencies:
      - target: Radroots
schemes:
  Radroots:
    build:
      targets:
        Radroots: all
    test:
      targets:
        - RadrootsTests
        - RadrootsUITests
