name: Tera

options:
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

packages:
  TeraApp:
    path: .
  RadrootsKit:
    url: https://github.com/radrootslabs/apple_kit.git
    revision: 35aedb6b54ff645b663fecff26082b3e91fcb232

targets:
  Tera:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tera/App/App.swift
      - path: Tera/Resources/Assets.xcassets
      - path: Tera/Resources/PrivacyInfo.xcprivacy
      - path: Tera/Resources/en.lproj/Localizable.strings
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Tera/Info.plist
    configFiles:
      Debug: Tera/Config/Debug.xcconfig
      Release: Tera/Config/Release.xcconfig
    dependencies:
      - package: TeraApp
    preBuildScripts:
      - name: Verify installed FFI artifacts
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/TeraFFI/scripts/verify-installed-artifacts.sh"
  TeraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TeraTests/TeraRuntimeClientTests.swift
      - path: TeraTests/TeraComposerPersistenceFFITests.swift
      - path: TeraTests/TeraRuntimeInvalidationTests.swift
      - path: TeraTests/TeraRuntimeBackpressureTests.swift
      - path: TeraTests/TeraRuntimeClientFixtures.swift
      - path: TeraTests/TeraSessionGenerationTests.swift
      - path: TeraTests/TeraErrorRecoveryTests.swift
      - path: TeraTests/TeraRuntimeBoundedTaskTests.swift
      - path: TeraTests/TeraRuntimeResourceFixtures.swift
      - path: TeraTests/TeraRuntimeResourceTaskTests.swift
      - path: TeraTests/TeraRuntimeResourceLifecycleTests.swift
      - path: TeraTests/TeraRuntimeShutdownTests.swift
      - path: TeraTests/TeraSessionResourceTests.swift
      - path: TeraTests/TeraStateTestFixtures.swift
      - path: TeraTests/TeraRootShellTests.swift
      - path: TeraTests/TeraStateMigrationTests.swift
      - path: TeraTests/TeraTodayStoreTests.swift
      - path: TeraTests/TeraTodaySyncFixtures.swift
      - path: TeraTests/TeraTodaySyncReceiptTests.swift
      - path: TeraTests/TeraTodayBackfillTests.swift
      - path: TeraTests/TeraTodayPresentationTests.swift
      - path: TeraTests/TeraTodayCacheFirstTests.swift
      - path: TeraTests/TeraTodayContextTests.swift
      - path: TeraTests/TeraTodayPagingTests.swift
      - path: TeraTests/TeraViewerCalendarTests.swift
      - path: TeraTests/TeraTodayCalendarScopeTests.swift
      - path: TeraTests/TeraTodayReconciliationTests.swift
      - path: TeraTests/TeraTodayReconciliationTaskTests.swift
      - path: TeraTests/TeraTodayReconciliationFFITests.swift
      - path: TeraTests/TeraMediaVisibilityTests.swift
      - path: TeraTests/TeraProductStartupTests.swift
      - path: TeraTests/TeraAddSchemaFixtures.swift
      - path: TeraTests/TeraScopeFixtures.swift
      - path: TeraTests/TeraScopeBackend.swift
      - path: TeraTests/TeraScopedStoreTests.swift
      - path: TeraTests/TeraScopedAddTests.swift
      - path: TeraTests/TeraScopedMediaTests.swift
      - path: TeraTests/TeraScopedObservationTests.swift
      - path: TeraTests/TeraObservationCoalescingTests.swift
      - path: TeraTests/TeraStoreRecoveryTests.swift
      - path: TeraTests/TeraAddObservationStartupTests.swift
      - path: TeraTests/TeraMediaStoreTests.swift
      - path: TeraTests/TeraMediaBudgetTests.swift
      - path: TeraTests/TeraTodayRenderingTests.swift
      - path: TeraTests/TeraMediaFileFixture.swift
      - path: TeraTests/TeraMediaOwnershipFFITests.swift
      - path: TeraTests/TeraBindingPortabilityTests.swift
      - path: TeraTests/TeraOpenedMediaCloseFixture.swift
      - path: TeraTests/TeraOpenedMediaTests.swift
      - path: TeraTests/TeraAddStoreTests.swift
      - path: TeraTests/TeraBackgroundUploadFixtures.swift
      - path: TeraTests/TeraMutationAdmissionTests.swift
      - path: TeraTests/TeraSupportingStoreTests.swift
      - path: TeraTests/TeraLifecycleTests.swift
      - path: TeraTests/TeraClockTests.swift
      - path: TeraTests/TeraCalendarFFICompatibilityTests.swift
      - path: TeraTests/TeraCalendarTimingTests.swift
      - path: TeraTests/TeraCalendarPresentationTests.swift
      - path: TeraTests/TeraCalendarEditingTests.swift
      - path: TeraTests/TeraCalendarComposerFFITests.swift
      - path: TeraTests/TeraRemoteQualificationTests.swift
      - path: TeraTests/TeraUserMessagesTests.swift
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.radroots.field-ios.tests
    dependencies:
      - target: Tera
      - package: TeraApp
      - package: RadrootsKit
  TeraUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TeraUITests/TeraRootShellUITests.swift
      - path: TeraUITests/TeraRemoteQualificationUITests.swift
      - path: test-fixtures/local-social-personas.v1.json
        buildPhase: resources
    settings:
      base:
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: TeraUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.radroots.field-ios.uitests
    dependencies:
      - target: Tera
schemes:
  Tera:
    build:
      targets:
        Tera: all
    test:
      targets:
        - TeraTests
        - TeraUITests
