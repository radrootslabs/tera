excluded:
  - .build
  - .swiftpm
  - Radroots.xcodeproj
  - Radroots/Generated
  - RadrootsFFI/.build

disabled_rules:
  # SwiftFormat is authoritative for overlapping structural style rules.
  - closure_parameter_position
  - opening_brace
  - trailing_comma
  # Complexity/size metrics are run separately by swift-quality.sh against a
  # checked exact baseline, so existing debt cannot hide new regressions.
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - multiple_closures_with_trailing_closure
  - type_body_length
  - type_name
