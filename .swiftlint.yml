excluded:
  - .build
  - .swiftpm
  - Radroots.xcodeproj
  - Radroots/Generated
  - RadrootsFFI/.build

disabled_rules:
  # SwiftFormat is authoritative for overlapping structural style rules.
  - closure_parameter_position
  - opening_brace
  - trailing_comma
  # Existing package architecture is governed by tests and API checks; these
  # metric and naming policies are not retrofit as Step 070 admission gates.
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - multiple_closures_with_trailing_closure
  - type_body_length
  - type_name
